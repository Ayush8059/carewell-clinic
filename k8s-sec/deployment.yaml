apiVersion: v1
kind: ServiceAccount
metadata: { name: carewell-sa }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: carewell-secure }
spec:
  replicas: 1
  selector:
    matchLabels: { app: carewell-secure }
  template:
    metadata:
      labels: { app: carewell-secure }
    spec:
      serviceAccountName: carewell-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: app
        image: ayush805900/carewell:IMAGE_TAG
        command: ["node", "server.js"]
        ports: [{ containerPort: 3000 }]
        envFrom:
        - secretRef: { name: db-secret }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "250m", memory: "256Mi" }
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: carewell-secure-svc }
spec:
  type: NodePort
  selector: { app: carewell-secure }
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30100
