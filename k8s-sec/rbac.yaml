apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: read-pods }
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: read-pods-bind }
subjects:
- kind: ServiceAccount
  name: carewell-sa
roleRef:
  kind: Role
  name: read-pods
  apiGroup: rbac.authorization.k8s.io
