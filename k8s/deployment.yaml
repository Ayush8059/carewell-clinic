apiVersion: apps/v1
kind: Deployment
metadata:
  name: carewell
spec:
  replicas: 1
  selector:
    matchLabels: { app: carewell }
  template:
    metadata:
      labels: { app: carewell }
    spec:
      containers:
      - name: carewell
        image: ayush805900/carewell:IMAGE_TAG
        ports: [{ containerPort: 3000 }]
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
